name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Least privilege: the workflow only reads the repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, lint and assemble
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify the Gradle wrapper
        run: sha256sum -c CHECKSUMS.txt

      - name: Unit tests
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest :cli:test

      # Renders the real Compose UI on the JVM: produces the store screenshots
      # and fails on an unexpected layout change.
      - name: Record screenshots
        run: ./gradlew --no-daemon :app:recordRoborazziDebug

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: app/build/screenshots/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Lint
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Assemble debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      # Compiles the instrumented tests. Running them needs an emulator, but
      # compiling them here catches breakage in the Compose tests on every push.
      - name: Compile instrumented tests
        run: ./gradlew --no-daemon :app:assembleDebugAndroidTest

      # Proves R8 shrinking and the (empty) keep rules work. Unsigned, as no
      # keystore is available on CI.
      - name: Assemble release APK and bundle (unsigned)
        run: ./gradlew --no-daemon :app:assembleRelease :app:bundleRelease

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/**
            core/build/reports/**
            app/build/outputs/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 14
