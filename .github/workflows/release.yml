name: Release

# Builds a Play-ready, signed Android App Bundle and attaches it to a GitHub
# release. Triggered by pushing a tag like v1.0.0, or by hand from the Actions
# tab. Never runs on ordinary pushes: a release should be deliberate.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name for this build (e.g. 1.0.0)'
        required: false

permissions:
  contents: write        # required to create the release and upload assets

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    name: Sign and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: actions/setup-gradle@v6

      - name: Verify the Gradle wrapper
        run: sha256sum -c CHECKSUMS.txt

      # The keystore arrives as a base64 secret so the binary never sits in the
      # repository. It is written to the runner's temp directory, which is
      # discarded with the runner.
      - name: Check signing secrets are present
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KEYSTORE_BASE64" ] || missing="$missing KEYSTORE_BASE64"
          [ -n "$KEYSTORE_PASSWORD" ] || missing="$missing KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || missing="$missing KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ] || missing="$missing KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            echo "Add them under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Decode the upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          if [ ! -s "$RUNNER_TEMP/upload-keystore.jks" ]; then
            echo "::error::The decoded keystore is empty. Re-create KEYSTORE_BASE64 with: base64 -w0 upload-keystore.jks"
            exit 1
          fi
          echo "keystore bytes: $(wc -c < "$RUNNER_TEMP/upload-keystore.jks")"

      # keystore.properties is git-ignored; build.gradle.kts picks it up and
      # applies the release signing config only when it exists.
      - name: Write keystore.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          {
            printf 'storeFile=%s\n' "$RUNNER_TEMP/upload-keystore.jks"
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > keystore.properties

      # Never publish a bundle that has not passed its own test suite.
      - name: Test and lint
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest :cli:test :app:lintRelease

      - name: Build signed bundle and APK
        run: ./gradlew --no-daemon :app:bundleRelease :app:assembleRelease

      # Proves the artifacts really are signed, instead of assuming the config
      # was picked up.
      - name: Verify signatures
        run: |
          set -euo pipefail
          aab=$(ls app/build/outputs/bundle/release/*.aab)
          apk=$(ls app/build/outputs/apk/release/*.apk)
          echo "bundle: $aab"
          jarsigner -verify "$aab"
          echo "apk: $apk"
          jarsigner -verify "$apk"
          jarsigner -verify -verbose -certs "$apk" | grep -E "^\s*(CN|OU|O)=" | head -3 || true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          gh release create "$tag" \
            --title "Prime Checker $tag" \
            --generate-notes \
            app/build/outputs/bundle/release/*.aab \
            app/build/outputs/apk/release/*.apk \
            app/build/outputs/mapping/release/mapping.txt
          echo "Published $tag"

      # Remove the signing material even if an earlier step failed.
      - name: Clean up signing material
        if: always()
        run: |
          rm -f keystore.properties "$RUNNER_TEMP/upload-keystore.jks"
