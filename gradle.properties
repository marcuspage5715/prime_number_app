# JVM settings for the Gradle daemon.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX is required by Jetpack Compose.
android.useAndroidX=true

# Each module compiles only the R class entries it declares, which keeps builds
# faster and stops modules from silently depending on each other's resources.
android.nonTransitiveRClass=true

kotlin.code.style=official

# Never put credentials, keystore passwords or API keys in this file: it is
# committed. Release signing is configured through an untracked
# keystore.properties (see keystore.properties.example).
